version: 2
updates:
  # Dev dependencies of the extension (pnpm lockfile is detected automatically).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # These versions define the supported Kiro/Node toolchain contract. Major
    # migrations are deliberate PRs with native and release acceptance checks.
    # @types/vscode is tied to the declared vscode ^1.90.0 API baseline.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      # Keep patch-only PRs separate so only those can be safely auto-merged.
      npm-patch:
        patterns:
          - "*"
        update-types:
          - patch
      npm-minor:
        patterns:
          - "*"
        update-types:
          - minor

  # Release publisher tools (ovsx, used only by the protected release job). Kept current weekly but never
  # auto-merged: the branch and group do not match the npm-patch auto-merge rule, so a maintainer reviews
  # and merges each update after CI, ideally not while a release is in progress.
  - package-ecosystem: npm
    directory: /scripts/release/publisher-tools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(release-tools)"
    groups:
      publisher-tools:
        patterns:
          - "*"

  # Workflow actions are pinned to commit SHAs; Dependabot updates the SHA and version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
