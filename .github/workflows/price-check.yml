# Weekly comparison of Kiro's public pricing and models pages with the reviewed catalog (scripts/price-check.ts).
# Read-only on the repository; the only write is an issue when the pages differ. No secrets, no Kiro data, no publishing.
name: price-check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Compare the public pages with the catalog
        id: compare
        run: |
          set +e
          node --disable-warning=ExperimentalWarning scripts/price-check.ts "$RUNNER_TEMP/price-report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open one issue when the pages differ
        if: steps.compare.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Kiro prices or model multipliers differ from the catalog"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/price-report.md"
          fi
      - name: Fail when the pages could not be verified
        if: steps.compare.outputs.code != '0' && steps.compare.outputs.code != '10'
        run: |
          echo "The price check could not verify the pages; see the report above."
          exit 1
